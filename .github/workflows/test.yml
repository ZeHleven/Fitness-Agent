name: Project CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and Agent evals
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fitness
          POSTGRES_PASSWORD: fitness_pass
          POSTGRES_DB: fitness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitness -d fitness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://fitness:fitness_pass@localhost:5432/fitness_test
      TEST_DATABASE_URL: postgresql+asyncpg://fitness:fitness_pass@localhost:5432/fitness_test
      SECRET_KEY: test-only-secret-key-with-at-least-64-characters-0000000000000000
      PYTHONPATH: backend
      DEEPSEEK_API_KEY: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Scan public source for credential-like values
        run: python scripts/check_public_secrets.py

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q --tb=short

      - name: Run deterministic Agent evaluation
        run: python backend/scripts/evaluate_agent_intents.py --mode rules --strict

  miniapp:
    name: Mini program typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: miniapp/pnpm-lock.yaml

      - name: Install mini program dependencies
        working-directory: miniapp
        run: pnpm install --frozen-lockfile

      - name: Typecheck mini program
        working-directory: miniapp
        run: pnpm typecheck

      - name: Build WeChat mini program
        working-directory: miniapp
        run: pnpm build:weapp
